[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aegis-score-studio"
version = "0.1.0"
description = "AI music deconstruction workstation"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "yt-dlp>=2024.8",
    "demucs>=4.0",
    "librosa>=0.10",
    "pretty_midi>=0.2",
    "soundfile>=0.12",
    "numpy>=2.0",
    "scipy>=1.13",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiofiles>=23.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "ruff>=0.5",
    "mypy>=1.10",
    "black>=24",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
